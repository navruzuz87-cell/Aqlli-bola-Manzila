name: manzila_aqlli_bola
description: "Manzila: Aqlli Bola — O'zbek bolalari uchun milliy ta'lim o'yini (5-12 yosh)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # Animations
  flutter_animate: ^4.5.0

  # Fonts
  google_fonts: ^6.2.1

  # Local storage
  shared_preferences: ^2.3.2

  # Icons
  cupertino_icons: ^1.0.8

  # Audio — v6.1.0 (BIRLASHTIRIILDI: v1-v30 versiyasi to'g'ri edi)
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
    - assets/images/characters/
    - assets/images/backgrounds/
